name: Deploy v5 Preview

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-v5:
    if: ${{ github.repository == 'jackyzha0/quartz' }}
    runs-on: ubuntu-latest
    name: Deploy v5 to Cloudflare Pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: bun install --frozen-lockfile

      - name: Install Quartz plugins
        run: bun --bun quartz plugin install

      - name: Check types and style
        run: bun run check

      - name: Build Quartz
        run: bun --bun quartz build -d docs -v

      - name: Deploy to Cloudflare Pages
        uses: AdrianGonz97/refined-cf-pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: quartz
          deploymentName: v5 Branch Preview
          branch: v5
          directory: public
